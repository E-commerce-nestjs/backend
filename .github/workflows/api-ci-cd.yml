name: CI/CD Nestjs to ECR to EC2

on:
    workflow_dispatch:
    push:
        branches:
            - develop

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 22.20.0

            - name: Install dependencies
              run: npm ci
              # working-directory: ./src

            - name: Generate prisma client
              run: npx prisma generate

            - name: Lint
              run: npm run lint

            - name: Run test
              run: npm run test

            - name: NPM audit (high severity)
              run: npm audit --audit-level=high

    deploy:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            id-token: write #id-token: write (Quan trọng nhất):
            # Tại sao cần: Để GitHub Actions có thể xin một "thẻ bài" tạm thời (JWT Token) từ GitHub.
            # Tác dụng: AWS sẽ kiểm tra "thẻ bài" này để cho phép bạn đăng nhập mà không cần lưu AWS_ACCESS_KEY_ID và AWS_SECRET_ACCESS_KEY lâu dài trong GitHub Secrets nữa. Đây là chuẩn bảo mật hiện đại (Keyless authentication). Nếu không có quyền write này, bước đăng nhập AWS (aws-actions/configure-aws-credentials) sẽ bị lỗi.
            contents: read # Tại sao cần: Để cho phép action actions/checkout có quyền clone (tải) mã nguồn của bạn về máy chủ chạy CI/CD.
            # Tác dụng: Đảm bảo workflow chỉ được đọc code chứ không được phép sửa hay đẩy code ngược lại repo (trừ khi bạn cấp quyền write), giúp an toàn hơn.
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            # Login to AWS via OIDC instead of using AWS secret access key
            - name: Config AWS OIDC
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Login to ECR
              run: |
                  aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
                  docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}

            # Build Docker image
            - name: Build Docker image
              run: docker build --platform linux/amd64 --no-cache -t nestjs-ecomerce:latest .

            #  Tag Docker Image to ECR
            - name: Tag Docker Image to ECR
              run: docker tag nestjs-ecomerce:latest ${{ secrets.ECR_REPOSITORY }}:latest

            # Push Docker Image to ECR
            - name: Push Docker Image to ECR
              run: docker push ${{ secrets.ECR_REPOSITORY }}:latest

            # Deploy to EC2
            - name: Deploy to EC2
              uses: appleboy/ssh-action@v0.1.7
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_KEY }}
                  port: 22
                  script: |
                      # Login to ECR
                      aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}

                      # Get secrets
                      SECRETS_JSON=$(aws secretsmanager get-secret-value \
                      --secret-id nestjs-prod-secrets \
                      --query SecretString \
                      --output text)

                      # Export env vars manually for docker-compose to pick up
                      export NODE_ENV=production
                      export PORT=$(echo $SECRETS_JSON | jq -r .PORT)
                      export API_URL=$(echo $SECRETS_JSON | jq -r .API_URL)
                      export ALLOWED_ORIGINS=$(echo $SECRETS_JSON | jq -r .ALLOWED_ORIGINS)
                      export POSTGRES_USER=$(echo $SECRETS_JSON | jq -r .POSTGRES_USER)
                      export POSTGRES_PASSWORD=$(echo $SECRETS_JSON | jq -r .POSTGRES_PASSWORD)
                      export POSTGRES_DB=$(echo $SECRETS_JSON | jq -r .POSTGRES_DB)
                      export POSTGRES_PORT=$(echo $SECRETS_JSON | jq -r .POSTGRES_PORT)
                      export POSTGRES_CONTAINER_NAME=postgres_ecommerce
                      # Construct DATABASE_URL internally or use the one from secrets if it matches inter-container comms
                      # Better to reconstruct it using container name 'postgres_db' for internal network
                      export DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres_db:$POSTGRES_PORT/$POSTGRES_DB?schema=public"

                      export AUTH_JWT_SECRET_KEY=$(echo $SECRETS_JSON | jq -r .AUTH_JWT_SECRET_KEY)
                      export AUTH_JWT_ACCESS_TOKEN_TTL=$(echo $SECRETS_JSON | jq -r .AUTH_JWT_ACCESS_TOKEN_TTL)
                      export AUTH_JWT_REFRESH_TOKEN_TTL=$(echo $SECRETS_JSON | jq -r .AUTH_JWT_REFRESH_TOKEN_TTL)

                      export REDIS_PASSWORD=$(echo $SECRETS_JSON | jq -r .REDIS_PASSWORD)
                      export REDIS_PORT=$(echo $SECRETS_JSON | jq -r .REDIS_PORT)
                      export REDIS_CONTAINER_NAME=redis_data
                      # Internal Redis URI using container name 'redis_db'
                      export REDIS_URI="redis://:$REDIS_PASSWORD@redis_db:6379"

                      export STRIPE_SECRET_KEY=$(echo $SECRETS_JSON | jq -r .STRIPE_SECRET_KEY)

                      # Create docker-compose.prod.yml
                      cat <<EOF > docker-compose.prod.yml
                      version: '3.8'
                      services:
                        api:
                          image: ${{ secrets.ECR_REPOSITORY }}:latest
                          container_name: nestjs-ecomerce-api
                          restart: always
                          ports:
                            - "$PORT:$PORT"
                          environment:
                            NODE_ENV: production
                            PORT: $PORT
                            DATABASE_URL: $DATABASE_URL
                            REDIS_URI: $REDIS_URI
                            AUTH_JWT_SECRET_KEY: $AUTH_JWT_SECRET_KEY
                            AUTH_JWT_ACCESS_TOKEN_TTL: $AUTH_JWT_ACCESS_TOKEN_TTL
                            AUTH_JWT_REFRESH_TOKEN_TTL: $AUTH_JWT_REFRESH_TOKEN_TTL
                            STRIPE_SECRET_KEY: $STRIPE_SECRET_KEY
                            ALLOWED_ORIGINS: $ALLOWED_ORIGINS
                          depends_on:
                            - postgres_db
                            - redis_db
                          networks:
                            - ecommerce-network
                          logging:
                             driver: awslogs
                             options:
                               awslogs-region: ${{ secrets.AWS_REGION }}
                               awslogs-group: nestjs-ecomerce-api
                               awslogs-stream: app-logs

                        postgres_db:
                          image: postgres:15-alpine
                          container_name: $POSTGRES_CONTAINER_NAME
                          restart: always
                          environment:
                            POSTGRES_USER: $POSTGRES_USER
                            POSTGRES_PASSWORD: $POSTGRES_PASSWORD
                            POSTGRES_DB: $POSTGRES_DB
                          ports:
                            - "$POSTGRES_PORT:$POSTGRES_PORT"
                          volumes:
                            - postgres_data:/var/lib/postgresql/data
                          networks:
                            - ecommerce-network
                          command: -p $POSTGRES_PORT

                        redis_db:
                          image: redis:7-alpine
                          container_name: $REDIS_CONTAINER_NAME
                          restart: always
                          ports:
                            - "$REDIS_PORT:6379"
                          volumes:
                            - redis_data:/data
                          networks:
                            - ecommerce-network
                          command: redis-server --requirepass $REDIS_PASSWORD

                      networks:
                        ecommerce-network:
                          driver: bridge

                      volumes:
                        postgres_data:
                        redis_data:
                      EOF

                      # Pull latest images
                      docker compose -f docker-compose.prod.yml pull

                      # Start services
                      docker compose -f docker-compose.prod.yml up -d --remove-orphans

                      # Cleanup unused images
                      docker image prune -f
