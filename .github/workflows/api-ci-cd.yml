name: CI/CD Nestjs to ECR to EC2

on:
    workflow_dispatch:
    push:
        branches:
            - develop

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 22.20.0

            - name: Install dependencies
              run: npm ci
              # working-directory: ./src

            - name: Generate prisma client
              run: npx prisma generate

            - name: Lint
              run: npm run lint

            - name: Build NestJS application
              run: npm run build

            - name: Login to Amazon ECR
              uses: aws-actions/amazon-ecr-login@v1
              with:
                  registry-uri: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
                  username: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

            - name: Build and push Docker image
              run: |
                  docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/nestjs-app:${{ github.sha }} .
                  docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/nestjs-app:${{ github.sha }}
